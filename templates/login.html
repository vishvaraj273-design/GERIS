<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GERIS | Sign In</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
<main class="login-card">
    <div class="brand-mark">G</div>
    <p class="eyebrow">EMERGENCY RESPONSE SYSTEM</p>
    <h1>Welcome to GERIS</h1>
    <p class="subtitle">Global Emergency Response &amp; Identification System</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" class="form">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="Enter username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter password" required>

        <button class="primary-btn" type="submit">Sign In</button>
    </form>

    <p class="register-line">New user?
        <a href="{{ url_for('register') }}">Create an account</a>
    </p>
    <p class="register-line responder-login-link">
        <a href="{{ url_for('responder_login') }}">Responder sign in</a>
    </p>
</main>
</body>
</html>
